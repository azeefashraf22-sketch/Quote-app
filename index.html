<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-icons/1.0.0/css/font-icons.min.css">
</head>
<body>

    <div class="wrapper">
        <header>
            <h2>My Quotes 📝</h2>
        </header>

        <div class="input-area">
            <input type="text" id="quoteInput" placeholder="Enter Any Quote">
            <button id="addBtn" type="button">Add</button>
        </div>

        <ul id="quoteList">
        </ul>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
